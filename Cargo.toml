[package]
name = "traccia"
version = "4.0.0"
edition = "2024"
authors = ["Saverio Scagnoli <svscagn@gmail.com>"]
description = "Small and flexible logging framework"
documentation = "https://docs.rs/traccia"
repository = "https://github.com/saverioscagnoli/traccia"
license = "MIT"
keywords = ["logging", "log", "logger", "terminal"]
categories = ["development-tools::debugging"]

[dependencies]
log = { version = "0.4.34", features = ["std"] }
